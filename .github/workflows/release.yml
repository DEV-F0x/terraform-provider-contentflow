name: release

# Triggered by pushing a semver tag (e.g. v1.0.0) -- see .goreleaser.yml for
# what actually gets built/signed/uploaded, and README.md for the one-time
# setup (GPG key + repo secrets) this depends on.
#
# NOTE: this workflow -- like the Terraform Registry itself -- expects to
# live at the root of its own "terraform-provider-contentflow" repository,
# not as a subdirectory of a larger repo. See README.md's "Publishing to
# the Terraform Registry" section before using this.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
